 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nadeer Platform</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>🎓 Nadeer Platform</h1>
 <nav class="menu">
    <button onclick="showHome()">🏠 Accueil</button>
    <button onclick="showHistory()">🕒 Historique</button>
    <button onclick="showChannel()">📺 Chaîne</button>
</nav>

    <input type="text" id="search" 
           placeholder="ابحث عن فيديو..." 
           onkeyup="searchVideos()">

    <button onclick="toggleUpload()">+ رفع فيديو</button>

</header>

<!-- صندوق الرفع -->
<section id="uploadBox" class="upload hidden">
    <h2>رفع فيديو</h2>

    <input type="text" id="title" placeholder="عنوان الفيديو">
    <input type="file" id="file" accept="video/*">

    <button onclick="uploadVideo()">نشر</button>
    <button onclick="startRecording()">🎥 بدء التسجيل</button>
    <button onclick="stopRecording()">⏹ إيقاف التسجيل</button>
</section>

<!-- عرض الفيديوهات -->
<section id="videos"></section>
 <section id="historySection" class="hidden">
    <h2>🕒 Historique</h2>
    <div id="historyVideos"></div>
</section>

<section id="channelSection" class="hidden">
    <h2>📺 Ma Chaîne</h2>
    <div id="channelVideos"></div>
</section>

<script src="script.js"></script>
</body>
</html>
